<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yönlendiriliyor...</title>
    <style>
        body {
            background-color: #0d1117;
            color: #c9d1d9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
    </style>
</head>
<body>
    <div>
        <h3>Yönlendiriliyorsunuz...</h3>
        <p id="targetText" style="color: #8b949e; font-size: 13px; margin-top: 10px;"></p>
    </div>

    <script>
        // URL'deki ?to= parametresini okur
        const urlParams = new URLSearchParams(window.location.search);
        let hedefUrl = urlParams.get('to');

        if (hedefUrl) {
            // Başına https:// eklenmemişse otomatik ekler
            if (!hedefUrl.startsWith("http://") && !hedefUrl.startsWith("https://")) {
                hedefUrl = "https://" + hedefUrl;
            }
            
            document.getElementById('targetText').innerText = hedefUrl;
            
            // Saniyesinde hedef siteye fırlatır
            window.location.replace(hedefUrl);
        } else {
            document.body.innerHTML = "<h3>Hedef adres bulunamadı!</h3>";
        }
    </script>
</body>
</html>
