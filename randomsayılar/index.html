<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Yönlendiriliyor...</title>
</head>
<body style="background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; text-align: center;">
    <div>
        <h3>Yönlendiriliyorsunuz...</h3>
        <p id="info" style="color: #8b949e; font-size: 13px;"></p>
    </div>

    <script>
        // URL'deki ?to= kısmını doğrudan okur (şifresiz ve net)
        const params = new URLSearchParams(window.location.search);
        let hedef = params.get('to');

        if (hedef) {
            // Eğer https:// eklenmemişse otomatik ekler
            if (!hedef.startsWith('http://') && !hedef.startsWith('https://')) {
                hedef = 'https://' + hedef;
            }
            
            document.getElementById('info').innerText = hedef;
            
            // Direkt hedefe gönderir
            window.location.replace(hedef);
        } else {
            document.body.innerHTML = "<h3>Hedef adres bulunamadı!</h3>";
        }
    </script>
</body>
</html>
