<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selim's Redirect Manager</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #161b22;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 480px;
            border: 1px solid #30363d;
        }
        h2 {
            margin-bottom: 6px;
            color: #58a6ff;
            font-size: 22px;
            text-align: center;
        }
        p.subtitle {
            text-align: center;
            color: #8b949e;
            font-size: 13px;
            margin-bottom: 20px;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #30363d;
            border-radius: 8px;
            background-color: #0d1117;
            color: #fff;
            font-size: 14px;
            outline: none;
            margin-bottom: 15px;
        }
        input[type="text"]:focus {
            border-color: #58a6ff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #238636;
            border: none;
            border-radius: 8px;
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #2ea043;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #0d1117;
            border-radius: 8px;
            border: 1px solid #30363d;
            display: none;
        }
        textarea {
            width: 100%;
            height: 80px;
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #58a6ff;
            padding: 8px;
            font-family: monospace;
            font-size: 11px;
            resize: none;
            outline: none;
            margin-bottom: 10px;
        }
        .link-btn {
            background-color: #1f6feb;
        }
        .link-btn:hover {
            background-color: #388bfd;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Hızlı Yönlendirici</h2>
    <p class="subtitle">randomsayılar/index.html için kod üretici</p>
    
    <input type="text" id="targetUrl" placeholder="Hedef siteyi yaz (örn: youtube.com)">
    <button onclick="kodUret()">Kodu Oluştur</button>

    <div class="result-box" id="resultBox">
        <p style="font-size:12px; color:#8b949e; margin-bottom:6px;">Oluşturulan Yönlendirme Kodu:</p>
        <textarea id="outputCode" readonly></textarea>
        <button class="link-btn" onclick="siteyeGit()">Yönlendirme Adresine Git</button>
    </div>
</div>

<script>
    function kodUret() {
        var inputVal = document.getElementById("targetUrl").value.trim();
        var resultBox = document.getElementById("resultBox");
        var outputCode = document.getElementById("outputCode");

        if (inputVal === "") {
            alert("Lütfen bir hedef site yaz!");
            return;
        }

        if (!inputVal.startsWith("http://") && !inputVal.startsWith("https://")) {
            inputVal = "https://" + inputVal;
        }

        // İstediğin gibi sade redirect kodu
        var kod = `var hedefSite = "${inputVal}";\nwindow.location.href = hedefSite;`;

        outputCode.value = kod;
        resultBox.style.display = "block";
    }

    function siteyeGit() {
        // Doğrudan senin sitendeki randomsayılar sayfasına gider
        window.open("https://selim8212.github.io/randomsayılar/", "_blank");
    }
</script>

</body>
</html>
