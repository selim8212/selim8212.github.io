<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelRoblox - Tam Ekran Oyna</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #090d16;
            font-family: 'Inter', sans-serif;
        }
    </style>
</head>
<body>

    <!-- Üst Mini Kontrol Çubuğu -->
    <div style="position: absolute; top: 0; left: 0; width: 100%; height: 35px; background: rgba(9, 13, 22, 0.85); display: flex; align-items: center; justify-content: space-between; padding: 0 15px; z-index: 9999; border-bottom: 1px solid rgba(255,255,255,0.1);">
        <span style="color: #06b6d4; font-size: 12px; font-weight: bold; letter-spacing: 1px;">SelRoblox Portal</span>
        <a href="https://selim8212.github.io/selgameweb.html" style="color: #cbd5e1; font-size: 12px; text-decoration: none; background: rgba(255,255,255,0.1); padding: 3px 10px; border-radius: 6px;">Ana Sayfaya Dön</a>
    </div>

    <!-- Tam Ekran Iframe Alanı -->
    <iframe src="https://selim8212.github.io/SelRoblox.html" 
            style="position: absolute; top: 35px; left: 0; width: 100%; height: calc(100% - 35px); border: none;" 
            allowfullscreen="true" 
            webkitallowfullscreen="true" 
            mozallowfullscreen="true" 
            allow="autoplay; fullscreen; joystick; gamepad">
    </iframe>

</body>
</html>
