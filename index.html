<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelTube Premium v9</title>
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background-color: #0f0f0f; color: white; margin: 0; padding: 0; }
        header { background-color: #212121; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #ff0000; margin: 0; font-size: 24px; cursor: pointer; letter-spacing: -1px; }
        h1 span { color: white; font-size: 14px; background: #333; padding: 2px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle;}
        
        .search-box { display: flex; width: 40%; }
        .search-box input { width: 100%; padding: 10px; background: #121212; border: 1px solid #303030; color: white; border-radius: 4px 0 0 4px; outline: none; }
        .search-box button { padding: 10px 20px; background: #303030; border: none; color: white; cursor: pointer; border-radius: 0 4px 4px 0; }

        .auth-buttons { display: flex; gap: 10px; align-items: center; }
        .btn-auth { padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; border: none; transition: 0.2s; }
        .btn-login { background: #ff0000; color: white; }
        .btn-login:hover { background: #cc0000; }
        
        .user-profile { display: none; align-items: center; gap: 12px; }
        #avatarContainer { cursor: pointer; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; }
        
        .user-avatar-img { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            object-fit: cover; 
            cursor: pointer;
            border: 2px solid #ff0000;
            transition: transform 0.2s;
        }
        .user-avatar-img:hover, .user-avatar-text:hover {
            transform: scale(1.08);
        }
        .user-avatar-text { 
            width: 38px; 
            height: 38px; 
            background: #ff0000; 
            color: white; 
            border-radius: 50%; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-weight: bold; 
            font-size: 16px; 
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s;
        }
        
        .profile-banner-container {
            display: none;
            width: 100%;
            height: 120px;
            background-color: #1a1a1a;
            background-size: cover;
            background-position: center;
            position: relative;
            border-bottom: 1px solid #333;
        }

        .categories-bar { background: #212121; padding: 10px 30px; display: flex; gap: 10px; border-top: 1px solid #333; overflow-x: auto; }
        .category-chip { background: #373737; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
        .category-chip.active { background: white; color: black; }

        .main-layout { display: flex; padding: 20px; gap: 20px; max-width: 1600px; margin: 0 auto; }
        .sidebar-menu { flex: 1; background: #1f1f1f; padding: 15px; border-radius: 12px; height: fit-content; min-width: 200px; }
        .menu-list { list-style: none; padding: 0; margin: 0; }
        .menu-list li { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .menu-list li:hover { background: #333; }

        .video-player-section { flex: 3; position: sticky; top: 150px; height: fit-content; }
        
        .video-container-box { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 2px solid #333; }
        .video-container-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        .bypass-trigger-btn { display: block; width: 100%; margin-top: 10px; padding: 12px; background: #ff5500; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }
        .bypass-trigger-btn:hover { background: #ff3300; }

        .video-details { background: #212121; padding: 20px; border-radius: 12px; margin-top: 15px; }
        .video-details h2 { margin-top: 0; font-size: 18px; line-height: 1.4; }
        
        .stats-row { display: flex; justify-content: space-between; color: #aaa; font-size: 13px; margin-bottom: 10px; }
        .description-box { font-size: 12px; color: #ddd; max-height: 100px; overflow-y: auto; background: #141414; padding: 10px; border-radius: 6px; }

        .feed-section { flex: 4; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .video-card { background: #212121; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .thumbnail-box { position: relative; padding-bottom: 56.25%; background: #000; }
        .thumbnail-box img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; }
        .card-info { padding: 10px; }
        .card-title { font-size: 13px; font-weight: bold; margin: 0 0 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .load-more-btn { display: block; width: 180px; margin: 20px auto; padding: 10px; background: #ff0000; color: white; border: none; border-radius: 25px; font-size: 14px; cursor: pointer; font-weight: bold; }

        .bypass-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .modal-content { width: 90%; max-width: 950px; height: 55vh; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
        .close-modal { margin-top: 15px; background: #ff0000; color: white; border: none; padding: 10px 30px; font-weight: bold; border-radius: 20px; cursor: pointer; }

        /* AUTH MODAL & SOSYAL BUTONLAR */
        .auth-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 10000; justify-content: center; align-items: center; }
        .auth-box { background: #212121; padding: 25px; border-radius: 12px; width: 100%; max-width: 400px; border: 1px solid #333; position: relative; }
        
        .auth-tabs { display: flex; border-bottom: 1px solid #333; margin-bottom: 20px; }
        .auth-tab { flex: 1; padding: 10px; text-align: center; cursor: pointer; font-weight: bold; color: #aaa; border-bottom: 2px solid transparent; }
        .auth-tab.active { color: #ff0000; border-bottom-color: #ff0000; }

        .auth-form-group { margin-bottom: 15px; }
        .auth-form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 5px; }
        .auth-form-group input { width: 100%; padding: 10px; background: #121212; border: 1px solid #333; border-radius: 6px; color: white; box-sizing: border-box; outline: none; }
        .auth-form-group input[type="file"] { padding: 5px; font-size: 12px; }
        .btn-submit-auth { width: 100%; padding: 12px; background: #ff0000; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit-auth:hover { background: #cc0000; }
        
        .social-divider { text-align: center; margin: 15px 0; color: #888; font-size: 12px; border-bottom: 1px solid #333; line-height: 0.1em; }
        .social-divider span { background: #212121; padding: 0 10px; }
        
        .btn-social { width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-bottom: 8px; font-size: 13px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-google { background: #ffffff; color: #000; }
        
        .close-auth { position: absolute; top: 15px; right: 15px; background: none; border: none; color: #aaa; font-size: 18px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="profileBanner" class="profile-banner-container"></div>

    <header>
        <h1 onclick="changeCategory('Ana Sayfa', this)">SelTube<span>PREMIUM</span></h1>
        
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="SelTube'da arama yapın...">
            <button onclick="searchNewQuery()">Ara</button>
        </div>

        <div class="auth-buttons" id="authButtons">
            <button class="btn-auth btn-login" onclick="openAuthModal('login')">Giriş Yap / Kayıt Ol</button>
        </div>

        <div class="user-profile" id="userProfile">
            <div id="avatarContainer" onclick="openProfileDetails()"></div>
            <button id="logoutBtn" style="background:#cc0000; color:white; border:none; padding:8px 14px; border-radius:20px; cursor:pointer; font-size:12px; font-weight:bold;">Çıkış Yap</button>
        </div>
    </header>

    <div class="categories-bar">
        <button class="category-chip active" onclick="changeCategory('Ana Sayfa', this)">Ana Sayfa</button>
        <button class="category-chip" onclick="changeCategory('Trendler', this)">Trendler</button>
        <button class="category-chip" onclick="changeCategory('futbol shorts', this)">Futbol Shorts</button>
        <button class="category-chip" onclick="changeCategory('müzik', this)">Müzik</button>
        <button class="category-chip" onclick="changeCategory('oyun', this)">Oyun</button>
    </div>

    <div class="main-layout">
        <div class="sidebar-menu">
            <h3>Hızlı Kanallar</h3>
            <ul class="menu-list">
                <li onclick="searchFromSidebar('Netd Müzik')">Netd Müzik</li>
                <li onclick="searchFromSidebar('Reynmen')">Reynmen</li>
            </ul>
        </div>

        <div class="video-player-section">
            <div class="video-container-box">
                <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            
            <button class="bypass-trigger-btn" id="bypassBtn" onclick="triggerBypass()">⚠️ Video Açılmadı mı? Güvenli Modda İçeride Çalıştır</button>
            
            <div class="video-details">
                <h2 id="mainTitle">Video Seciliyor...</h2>
                <div class="stats-row">
                    <span id="mainViews">0 Izlenme</span>
                    <span id="mainLikes">0 Begeni</span>
                </div>
                <div class="description-box" id="mainDesc">Aciklama yukleniyor...</div>
            </div>
        </div>

        <div class="feed-section">
            <div class="grid-container" id="videoGrid"></div>
            <button class="load-more-btn" id="loadMoreBtn" onclick="fetchVideos()">Daha Fazla Yukle</button>
        </div>
    </div>

    <div id="bypassLayer" class="bypass-modal">
        <div class="modal-content">
            <iframe id="bypassPlayer" width="100%" height="100%" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <button class="close-modal" onclick="closeBypassVideo()">❌ Oynatıcıyı Kapat (Geri Dön)</button>
    </div>

    <!-- MODAL -->
    <div id="authModal" class="auth-modal">
        <div class="auth-box">
            <button class="close-auth" onclick="closeAuthModal()">✕</button>

            <div class="auth-tabs">
                <div class="auth-tab active" id="tabLoginBtn">Giriş Yap</div>
                <div class="auth-tab" id="tabRegisterBtn">Kayıt Ol</div>
            </div>

            <!-- GİRİŞ FORMU -->
            <form id="loginForm" style="display: block;">
                <div class="auth-form-group">
                    <label>E-Posta Adresi</label>
                    <input type="email" id="loginEmail" required placeholder="ornek@mail.com">
                </div>
                <div class="auth-form-group">
                    <label>Şifre</label>
                    <input type="password" id="loginPassword" required placeholder="******">
                </div>
                <button type="submit" class="btn-submit-auth">Giriş Yap</button>
            </form>

            <!-- KAYIT FORMU -->
            <form id="registerForm" style="display: none;">
                <div class="auth-form-group">
                    <label>E-Posta Adresi</label>
                    <input type="email" id="regEmail" required placeholder="ornek@mail.com">
                </div>
                <div class="auth-form-group">
                    <label>Şifre Oluştur</label>
                    <input type="password" id="regPassword" required placeholder="******">
                </div>
                <div class="auth-form-group">
                    <label>Profil Fotoğrafı Seç (İsteğe Bağlı)</label>
                    <input type="file" id="avatarFileInput" accept="image/*">
                </div>
                <div class="auth-form-group">
                    <label>Kanal Banner Resmi Seç (İsteğe Bağlı)</label>
                    <input type="file" id="bannerFileInput" accept="image/*">
                </div>
                <button type="submit" class="btn-submit-auth">Kayıt Ol ve Başla</button>
            </form>

            <div class="social-divider"><span>VEYA</span></div>

            <button type="button" class="btn-social btn-google" id="googleAuthBtn">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="18"> Google ile Devam Et
            </button>
        </div>
    </div>

    <!-- FIREBASE SDK ENTEGRASYONU -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            createUserWithEmailAndPassword, 
            signInWithEmailAndPassword, 
            signInWithPopup, 
            GoogleAuthProvider,
            signOut,
            onAuthStateChanged,
            sendEmailVerification
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDf9QjqmVtMjyjzscx4yhikL0pzL2myEak",
            authDomain: "selim8212github.firebaseapp.com",
            projectId: "selim8212github",
            storageBucket: "selim8212github.firebasestorage.app",
            messagingSenderId: "606637585033",
            appId: "1:606637585033:web:de6bb0349c9e7a3c5e4c58",
            measurementId: "G-F5VNYJB28C"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const googleProvider = new GoogleAuthProvider();

        window.currentUserData = null;

        // Oturum Durumu Takibi
        onAuthStateChanged(auth, (user) => {
            const authBtnGroup = document.getElementById('authButtons');
            const userProfileGroup = document.getElementById('userProfile');
            const avatarContainer = document.getElementById('avatarContainer');
            const bannerEl = document.getElementById('profileBanner');

            if (user) {
                window.currentUserData = user;
                authBtnGroup.style.display = "none";
                userProfileGroup.style.display = "flex";
                
                const userCustomData = JSON.parse(localStorage.getItem(`selTubeUserData_${user.uid}`) || '{}');
                const avatarSrc = userCustomData.avatar || user.photoURL;

                if(avatarSrc) {
                    avatarContainer.innerHTML = `<img src="${avatarSrc}" class="user-avatar-img" title="${user.email}">`;
                } else {
                    const firstLetter = (user.email || 'U').charAt(0).toUpperCase();
                    avatarContainer.innerHTML = `<div class="user-avatar-text" title="${user.email}">${firstLetter}</div>`;
                }

                if(userCustomData.banner) {
                    bannerEl.style.backgroundImage = `url('${userCustomData.banner}')`;
                    bannerEl.style.display = "block";
                } else {
                    bannerEl.style.display = "none";
                }
            } else {
                window.currentUserData = null;
                authBtnGroup.style.display = "flex";
                userProfileGroup.style.display = "none";
                bannerEl.style.display = "none";
            }
        });

        // E-Posta Kayıt
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const avatarFile = document.getElementById('avatarFileInput').files[0];
            const bannerFile = document.getElementById('bannerFileInput').files[0];

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;

                await sendEmailVerification(user);
                alert("Kayıt başarılı! Doğrulama e-postası gönderildi.");

                let avatarBase64 = avatarFile ? await fileToBase64(avatarFile) : null;
                let bannerBase64 = bannerFile ? await fileToBase64(bannerFile) : null;

                localStorage.setItem(`selTubeUserData_${user.uid}`, JSON.stringify({
                    avatar: avatarBase64,
                    banner: bannerBase64
                }));

                closeAuthModal();
            } catch (error) {
                alert("Kayıt Hatası: " + error.message);
            }
        });

        // E-Posta Giriş
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                closeAuthModal();
            } catch (error) {
                alert("Giriş Hatası: " + error.message);
            }
        });

        // Google Giriş
        document.getElementById('googleAuthBtn').addEventListener('click', async () => {
            try {
                await signInWithPopup(auth, googleProvider);
                closeAuthModal();
            } catch (error) {
                alert("Google Giriş Hatası: " + error.message);
            }
        });

        // Çıkış Yap
        document.getElementById('logoutBtn').addEventListener('click', () => {
            signOut(auth);
        });

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                if(!file) return resolve(null);
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
            });
        }
    </script>

    <script>
        const API_KEY = 'AIzaSyAYFZLylTE_k-hpYU_MAFvZ_sNZ3Jx9kBY'; 
        let nextPageToken = '';
        let currentMode = 'Ana Sayfa'; 
        let currentQuery = '';
        let activeVideoId = '';

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('tabLoginBtn').addEventListener('click', () => switchAuthTab('login'));
            document.getElementById('tabRegisterBtn').addEventListener('click', () => switchAuthTab('register'));
        });

        function openProfileDetails() {
            if (window.currentUserData) {
                alert("Giriş Yapılan E-Posta: " + window.currentUserData.email);
            }
        }

        async function fetchVideos() {
            const loadBtn = document.getElementById('loadMoreBtn');
            loadBtn.innerText = 'Yukleniyor...';

            let url = '';
            if (currentMode === 'Ana Sayfa') {
                url = `https://www.googleapis.com/youtube/v3/videos?key=${API_KEY}&part=snippet&chart=mostPopular&regionCode=TR&maxResults=20`;
            } else if (currentMode === 'Trendler') {
                url = `https://www.googleapis.com/youtube/v3/videos?key=${API_KEY}&part=snippet&chart=mostPopular&regionCode=TR&maxResults=20&videoCategoryId=17`; 
            } else {
                url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&q=${encodeURIComponent(currentQuery)}&part=snippet&type=video&maxResults=20`;
            }

            if (nextPageToken) url += `&pageToken=${nextPageToken}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if(data.items && data.items.length > 0) {
                    nextPageToken = data.nextPageToken || '';
                    const grid = document.getElementById('videoGrid');
                    
                    if(grid.children.length === 0) {
                        const firstId = (currentMode === 'Ana Sayfa' || currentMode === 'Trendler') ? data.items[0].id : data.items[0].id.videoId;
                        loadVideoDetails(firstId);
                    }

                    data.items.forEach(item => {
                        const vId = (currentMode === 'Ana Sayfa' || currentMode === 'Trendler') ? item.id : item.id.videoId;
                        if(!vId) return;
                        
                        const title = item.snippet.title;
                        const thumb = item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.medium.url;

                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.onclick = () => loadVideoDetails(vId);
                        card.innerHTML = `
                            <div class="thumbnail-box"><img src="${thumb}"></div>
                            <div class="card-info">
                                <p class="card-title">${title}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                    loadBtn.innerText = 'Daha Fazla Yukle';
                }
            } catch (error) {
                console.error(error);
            }
        }

        function loadVideoDetails(videoId) {
            activeVideoId = videoId;
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            
            const detailsUrl = `https://www.googleapis.com/youtube/v3/videos?key=${API_KEY}&id=${videoId}&part=snippet,statistics`;
            fetch(detailsUrl).then(res => res.json()).then(data => {
                if(data.items && data.items.length > 0) {
                    const videoData = data.items[0];
                    document.getElementById('mainTitle').innerText = videoData.snippet.title;
                    document.getElementById('mainViews').innerText = `${parseInt(videoData.statistics.viewCount || 0).toLocaleString('tr-TR')} Izlenme`;
                    document.getElementById('mainLikes').innerText = `${parseInt(videoData.statistics.likeCount || 0).toLocaleString('tr-TR')} Begeni`;
                    document.getElementById('mainDesc').innerText = videoData.snippet.description || 'Aciklama yok.';
                }
            });
        }

        function triggerBypass() {
            if(!activeVideoId) return;
            const modal = document.getElementById('bypassLayer');
            const iframe = document.getElementById('bypassPlayer');
            iframe.src = `https://www.youtube.com/embed/${activeVideoId}?autoplay=1&modestbranding=1&rel=0&origin=${window.location.origin}`;
            modal.style.display = "flex";
        }

        function closeBypassVideo() {
            document.getElementById('bypassLayer').style.display = "none";
            document.getElementById('bypassPlayer').src = "";
        }

        function changeCategory(category, element) {
            document.querySelectorAll('.category-chip').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            document.getElementById('videoGrid').innerHTML = '';
            nextPageToken = '';
            currentMode = (category === 'Ana Sayfa' || category === 'Trendler') ? category : 'Search';
            currentQuery = category;
            fetchVideos();
        }

        function searchNewQuery() {
            const query = document.getElementById('searchInput').value;
            if(query.trim() !== "") {
                currentMode = 'Search'; currentQuery = query;
                nextPageToken = ''; document.getElementById('videoGrid').innerHTML = '';
                fetchVideos();
            }
        }

        function searchFromSidebar(channelName) {
            currentMode = 'Search'; currentQuery = channelName;
            nextPageToken = ''; document.getElementById('videoGrid').innerHTML = '';
            fetchVideos();
        }

        function openAuthModal(defaultTab = 'login') {
            document.getElementById('authModal').style.display = "flex";
            switchAuthTab(defaultTab);
        }

        function closeAuthModal() {
            document.getElementById('authModal').style.display = "none";
        }

        function switchAuthTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const tabLoginBtn = document.getElementById('tabLoginBtn');
            const tabRegisterBtn = document.getElementById('tabRegisterBtn');

            if(tab === 'login') {
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
                tabLoginBtn.classList.add('active');
                tabRegisterBtn.classList.remove('active');
            } else {
                loginForm.style.display = 'none';
                registerForm.style.display = 'block';
                tabRegisterBtn.classList.add('active');
                tabLoginBtn.classList.remove('active');
            }
        }

        fetchVideos();
    </script>
</body>
</html>
