<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelTube Premium - Dinamik</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yt: {
                            black: '#0f0f0f',
                            sidebar: '#0f0f0f',
                            card: '#1f1f1f',
                            hover: '#383838',
                            border: '#272727',
                            red: '#cc0000'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-yt-black text-white min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 h-14 bg-yt-black/95 backdrop-blur-md border-b border-yt-border px-4 flex items-center justify-between z-50">
        <div class="flex items-center space-x-4">
            <button id="menu-toggle" class="p-2 hover:bg-yt-hover rounded-full transition text-gray-300">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <a href="#" onclick="location.reload();" class="flex items-center space-x-1.5 cursor-pointer group">
                <div class="bg-red-600 text-white p-2 rounded-xl flex items-center justify-center shadow-lg shadow-red-600/40">
                    <i class="fa-solid fa-play text-xs"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">SelTube <span class="text-[10px] bg-red-600/20 text-red-500 border border-red-500/30 px-1.5 py-0.5 rounded font-bold ml-0.5">PREMIUM</span></span>
            </a>
        </div>

        <div class="flex items-center flex-1 max-w-2xl mx-4">
            <div class="flex items-center w-full bg-[#121212] border border-yt-border rounded-l-full px-4 py-2 focus-within:border-blue-500 transition">
                <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3 text-sm"></i>
                <input type="text" id="search-input" placeholder="YouTube'da ara..." class="bg-transparent w-full focus:outline-none text-sm text-white placeholder-gray-500">
            </div>
            <button id="search-btn" class="bg-yt-card border border-l-0 border-yt-border px-6 py-2 rounded-r-full hover:bg-yt-hover transition text-gray-300">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>
        </div>

        <div class="flex items-center space-x-3">
            <div id="auth-container">
                <button onclick="openAuthModal()" class="border border-yt-border hover:border-gray-500 text-blue-400 font-semibold px-4 py-1.5 rounded-full text-sm transition flex items-center space-x-2">
                    <i class="fa-regular fa-circle-user text-base"></i>
                    <span>Oturum Aç</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER -->
    <div class="flex pt-14 flex-1">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-yt-sidebar h-[calc(100vh-3.5rem)] fixed left-0 top-14 p-3 overflow-y-auto border-r border-yt-border z-40 transition-transform duration-300">
            <div class="space-y-1">
                <button onclick="searchVideos('Trending')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl bg-yt-hover text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-house w-5 text-center"></i>
                    <span>Ana Sayfa</span>
                </button>
                <button onclick="searchVideos('Trendler Popüler')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-yt-hover text-gray-300 hover:text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-fire w-5 text-center text-orange-500"></i>
                    <span>Trendler</span>
                </button>
                <button onclick="searchVideos('Music 2026')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-yt-hover text-gray-300 hover:text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-music w-5 text-center text-blue-400"></i>
                    <span>Müzik</span>
                </button>
                <button onclick="searchVideos('Gaming Gameplay')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-yt-hover text-gray-300 hover:text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-gamepad w-5 text-center text-green-400"></i>
                    <span>Oyun</span>
                </button>
                <button onclick="searchVideos('Technology Tech')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-yt-hover text-gray-300 hover:text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-laptop-code w-5 text-center text-purple-400"></i>
                    <span>Teknoloji</span>
                </button>
            </div>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="flex-1 ml-64 p-6 transition-all duration-300">
            <!-- Kategoriler Şeridi -->
            <div class="flex items-center space-x-2.5 overflow-x-auto hide-scrollbar pb-4 mb-6" id="chips-bar">
                <button onclick="searchVideos('Popüler')" class="chip bg-white text-black px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition shadow">Tümü</button>
                <button onclick="searchVideos('Live Stream Canlı')" class="chip bg-yt-card hover:bg-yt-hover text-white px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition">Canlı Yayın</button>
                <button onclick="searchVideos('Podcast')" class="chip bg-yt-card hover:bg-yt-hover text-white px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition">Podcast</button>
                <button onclick="searchVideos('Football Futbol')" class="chip bg-yt-card hover:bg-yt-hover text-white px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition">Futbol</button>
                <button onclick="searchVideos('Movie Trailer Sinema')" class="chip bg-yt-card hover:bg-yt-hover text-white px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition">Sinema</button>
                <button onclick="searchVideos('Belgesel Documentary')" class="chip bg-yt-card hover:bg-yt-hover text-white px-4 py-1.5 rounded-xl text-sm font-semibold whitespace-nowrap transition">Belgesel</button>
            </div>

            <!-- Video Grid -->
            <div id="video-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5">
                <!-- Dinamik olarak YouTube API'den yüklenecek -->
            </div>
        </main>
    </div>

    <!-- VİDEO MODALI -->
    <div id="video-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-yt-card border border-yt-border w-full max-w-4xl rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[92vh]">
            <div class="flex items-center justify-between px-5 py-3.5 border-b border-yt-border bg-[#181818]">
                <h3 id="modal-title" class="font-bold text-base truncate text-white">Oynatıcı</h3>
                <button onclick="closeVideoModal()" class="text-gray-400 hover:text-white p-1.5 rounded-full hover:bg-yt-hover transition">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <div class="relative w-full aspect-video bg-black flex items-center justify-center">
                <iframe id="modal-iframe" class="w-full h-full" src="" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
            </div>
            <div class="p-4 flex items-center justify-between border-t border-yt-border bg-[#181818]">
                <div class="flex items-center space-x-3">
                    <div id="modal-avatar" class="w-10 h-10 rounded-full bg-red-600 flex items-center justify-center font-bold text-white shadow">S</div>
                    <div>
                        <h4 id="modal-channel" class="font-bold text-sm text-white">Kanal Adı</h4>
                        <span class="text-xs text-gray-400">SelTube Premium</span>
                    </div>
                </div>
                <button onclick="openExternalPlayer()" class="bg-red-600 hover:bg-red-700 text-white text-xs font-bold px-4 py-2.5 rounded-xl transition shadow-lg">
                    <i class="fa-solid fa-external-link-alt"></i> YouTube'da Aç
                </button>
            </div>
        </div>
    </div>

    <!-- GİRİŞ MODALI -->
    <div id="auth-modal" class="fixed inset-0 bg-black/85 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
        <div class="bg-yt-card border border-yt-border w-full max-w-md rounded-2xl overflow-hidden shadow-2xl p-6 relative">
            <button onclick="closeAuthModal()" class="absolute top-4 right-4 text-gray-400 hover:text-white"><i class="fa-solid fa-xmark text-xl"></i></button>
            <div class="text-center mb-6">
                <div class="bg-red-600 text-white w-12 h-12 rounded-2xl mx-auto flex items-center justify-center text-xl shadow-lg mb-2"><i class="fa-solid fa-play"></i></div>
                <h2 class="text-xl font-bold">Giriş Yap</h2>
            </div>
            <div class="space-y-4">
                <input type="email" id="auth-email" placeholder="E-posta adresi" class="w-full bg-[#121212] border border-yt-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600">
                <input type="password" id="auth-password" placeholder="Şifre" class="w-full bg-[#121212] border border-yt-border rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none focus:border-red-600">
                <button onclick="handleLogin()" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-2.5 rounded-xl text-sm transition">Giriş Yap</button>
            </div>
        </div>
    </div>

    <footer class="border-t border-yt-border py-4 px-6 text-center text-xs text-gray-500 bg-yt-black ml-0 sm:ml-64">
        <p>&copy; 2026 SelTube Premium - Tüm hakları saklıdır. Gelişmiş YouTube Deneyimi.</p>
    </footer>

    <!-- JAVASCRIPT & YOUTUBE API -->
    <script>
        const API_KEY = 'AIzaSyCGByshlekmVd_A3f_8DDd9_CJ8gdA75Mw';

        window.addEventListener('DOMContentLoaded', () => {
            searchVideos('Popüler'); // Sayfa açılınca API'den popüler videoları getir

            document.getElementById('menu-toggle').addEventListener('click', () => {
                document.getElementById('sidebar').classList.toggle('-translate-x-full');
            });

            document.getElementById('search-btn').addEventListener('click', () => {
                const q = document.getElementById('search-input').value.trim();
                if(q) searchVideos(q);
            });

            document.getElementById('search-input').addEventListener('keypress', (e) => {
                if(e.key === 'Enter' && e.target.value.trim()) searchVideos(e.target.value.trim());
            });
        });

        async function searchVideos(query) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = `<div class="col-span-full text-center py-24 text-gray-400 text-sm">Yükleniyor...</div>`;

            const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&maxResults=16&q=${encodeURIComponent(query)}&type=video&key=${API_KEY}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if (data.items && data.items.length > 0) {
                    renderVideos(data.items);
                } else {
                    grid.innerHTML = `<div class="col-span-full text-center py-24 text-gray-400 text-sm">Video bulunamadı veya API kotası doldu.</div>`;
                }
            } catch (error) {
                console.error('API Hatası:', error);
                grid.innerHTML = `<div class="col-span-full text-center py-24 text-red-500 text-sm">Videolar yüklenirken bir hata oluştu.</div>`;
            }
        }

        function renderVideos(items) {
            const grid = document.getElementById('video-grid');
            grid.innerHTML = items.map(item => {
                const videoId = item.id.videoId;
                const title = item.snippet.title;
                const channelTitle = item.snippet.channelTitle;
                const publishTime = new Date(item.snippet.publishedAt).toLocaleDateString();
                const thumbnail = item.snippet.thumbnails.high.url;
                const avatarLetter = channelTitle.charAt(0).toUpperCase();

                return `
                    <div class="flex flex-col group cursor-pointer" onclick="openVideoModal('${videoId}', '${title.replace(/'/g, "")}', '${channelTitle.replace(/'/g, "")}')">
                        <div class="relative w-full aspect-video bg-yt-card rounded-2xl overflow-hidden border border-yt-border group-hover:border-gray-500 transition shadow-md">
                            <img src="${thumbnail}" alt="${title}" class="w-full h-full object-cover group-hover:scale-105 transition duration-300">
                        </div>
                        <div class="flex space-x-3 mt-3">
                            <div class="w-9 h-9 rounded-full bg-red-600 flex-shrink-0 flex items-center justify-center font-bold text-sm text-white shadow">${avatarLetter}</div>
                            <div class="flex-1 overflow-hidden">
                                <h3 class="font-semibold text-sm text-white line-clamp-2 group-hover:text-blue-400 transition">${title}</h3>
                                <p class="text-xs text-gray-400 mt-1">${channelTitle}</p>
                                <p class="text-xs text-gray-500">${publishTime}</p>
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        let activeId = '';
        function openVideoModal(id, title, channel) {
            activeId = id;
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-channel').innerText = channel;
            document.getElementById('modal-iframe').src = `https://www.youtube-nocookie.com/embed/${id}?autoplay=1`;
            document.getElementById('video-modal').classList.remove('hidden');
        }

        function closeVideoModal() {
            document.getElementById('modal-iframe').src = '';
            document.getElementById('video-modal').classList.add('hidden');
        }

        function openExternalPlayer() {
            if(activeId) window.open(`https://www.youtube.com/watch?v=${activeId}`, '_blank');
        }

        function openAuthModal() { document.getElementById('auth-modal').classList.remove('hidden'); }
        function closeAuthModal() { document.getElementById('auth-modal').classList.add('hidden'); }
        function handleLogin() {
            alert('Giriş başarılı!');
            closeAuthModal();
        }
    </script>
</body>
</html>
