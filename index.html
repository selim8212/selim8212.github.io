<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelTube Premium v9</title>
    <style>
        body { font-family: 'Roboto', Arial, sans-serif; background-color: #0f0f0f; color: white; margin: 0; padding: 0; }
        header { background-color: #212121; padding: 15px 30px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h1 { color: #ff0000; margin: 0; font-size: 24px; cursor: pointer; letter-spacing: -1px; }
        h1 span { color: white; font-size: 14px; background: #333; padding: 2px 6px; border-radius: 4px; margin-left: 5px; vertical-align: middle;}
        
        .search-box { display: flex; width: 40%; }
        .search-box input { width: 100%; padding: 10px; background: #121212; border: 1px solid #303030; color: white; border-radius: 4px 0 0 4px; outline: none; }
        .search-box button { padding: 10px 20px; background: #303030; border: none; color: white; cursor: pointer; border-radius: 0 4px 4px 0; }
        
        .categories-bar { background: #212121; padding: 10px 30px; display: flex; gap: 10px; border-top: 1px solid #333; overflow-x: auto; }
        .category-chip { background: #373737; color: white; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 500; white-space: nowrap; }
        .category-chip.active { background: white; color: black; }

        .main-layout { display: flex; padding: 20px; gap: 20px; max-width: 1600px; margin: 0 auto; }
        
        .sidebar-menu { flex: 1; background: #1f1f1f; padding: 15px; border-radius: 12px; height: fit-content; min-width: 200px; }
        .menu-list { list-style: none; padding: 0; margin: 0; }
        .menu-list li { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 14px; }
        .menu-list li:hover { background: #333; }

        .video-player-section { flex: 3; position: sticky; top: 150px; height: fit-content; }
        
        /* Gözden Kaçması İmkansız Ana Oynatıcı Kutusu */
        .video-container-box { position: relative; width: 100%; padding-bottom: 56.25%; background: #000; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.7); border: 2px solid #333; }
        .video-container-box iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }

        /* Telif Durumunda Çıkacak Kurtarıcı Buton */
        .bypass-trigger-btn { display: block; width: 100%; margin-top: 10px; padding: 12px; background: #ff5500; color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; text-align: center; font-size: 14px; }
        .bypass-trigger-btn:hover { background: #ff3300; }

        .video-details { background: #212121; padding: 20px; border-radius: 12px; margin-top: 15px; }
        .video-details h2 { margin-top: 0; font-size: 18px; line-height: 1.4; }
        
        .stats-row { display: flex; justify-content: space-between; color: #aaa; font-size: 13px; margin-bottom: 10px; }
        .description-box { font-size: 12px; color: #ddd; max-height: 100px; overflow-y: auto; background: #141414; padding: 10px; border-radius: 6px; }

        .feed-section { flex: 4; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; }
        .video-card { background: #212121; border-radius: 12px; overflow: hidden; cursor: pointer; }
        .thumbnail-box { position: relative; padding-bottom: 56.25%; background: #000; }
        .thumbnail-box img { position: absolute; top:0; left:0; width:100%; height:100%; object-fit: cover; }
        .card-info { padding: 10px; }
        .card-title { font-size: 13px; font-weight: bold; margin: 0 0 5px 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .card-channel { color: #aaa; font-size: 11px; margin: 0; }
        
        .load-more-btn { display: block; width: 180px; margin: 20px auto; padding: 10px; background: #ff0000; color: white; border: none; border-radius: 25px; font-size: 14px; cursor: pointer; font-weight: bold; }

        /* ARKA PLAN MODAL KATMANI */
        .bypass-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
        .modal-content { width: 90%; max-width: 950px; height: 55vh; background: #000; border-radius: 12px; overflow: hidden; border: 1px solid #444; }
        .close-modal { margin-top: 15px; background: #ff0000; color: white; border: none; padding: 10px 30px; font-weight: bold; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <header>
        <h1 onclick="changeCategory('Ana Sayfa', this)">SelTube<span>PREMIUM</span></h1>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="SelTube'da arama yapın...">
            <button onclick="searchNewQuery()">Ara</button>
        </div>
    </header>

    <div class="categories-bar">
        <button class="category-chip active" onclick="changeCategory('Ana Sayfa', this)">Ana Sayfa</button>
        <button class="category-chip" onclick="changeCategory('Trendler', this)">Trendler</button>
        <button class="category-chip" onclick="changeCategory('futbol shorts', this)">Futbol Shorts</button>
        <button class="category-chip" onclick="changeCategory('müzik', this)">Müzik</button>
        <button class="category-chip" onclick="changeCategory('oyun', this)">Oyun</button>
    </div>

    <div class="main-layout">
        <div class="sidebar-menu">
            <h3>Hızlı Kanallar</h3>
            <ul class="menu-list">
                <li onclick="searchFromSidebar('Netd Müzik')">Netd Müzik</li>
                <li onclick="searchFromSidebar('Reynmen')">Reynmen</li>
            </ul>
        </div>

        <div class="video-player-section">
            <div class="video-container-box">
                <iframe id="mainPlayer" src="" allowfullscreen allow="autoplay; encrypted-media"></iframe>
            </div>
            
            <button class="bypass-trigger-btn" id="bypassBtn" onclick="triggerBypass()">⚠️ Video Açılmadı mı? Güvenli Modda İçeride Çalıştır</button>
            
            <div class="video-details">
                <h2 id="mainTitle">Video Seciliyor...</h2>
                <div class="stats-row">
                    <span id="mainViews">0 Izlenme</span>
                    <span id="mainLikes">0 Begeni</span>
                </div>
                <div class="description-box" id="mainDesc">Aciklama yukleniyor...</div>
            </div>
        </div>

        <div class="feed-section">
            <div class="grid-container" id="videoGrid"></div>
            <button class="load-more-btn" id="loadMoreBtn" onclick="fetchVideos()">Daha Fazla Yukle</button>
        </div>
    </div>

    <div id="bypassLayer" class="bypass-modal">
        <div class="modal-content">
            <iframe id="bypassPlayer" width="100%" height="100%" src="" allow="autoplay; encrypted-media" allowfullscreen></iframe>
        </div>
        <button class="close-modal" onclick="closeBypassVideo()">❌ Oynatıcıyı Kapat (Geri Dön)</button>
    </div>

    <script>
        const API_KEY = 'AIzaSyAYFZLylTE_k-hpYU_MAFvZ_sNZ3Jx9kBY'; 
        let nextPageToken = '';
        let currentMode = 'Ana Sayfa'; 
        let currentQuery = '';
        let activeVideoId = '';

        async function fetchVideos() {
            const loadBtn = document.getElementById('loadMoreBtn');
            loadBtn.innerText = 'Yukleniyor...';

            let url = '';
            if (currentMode === 'Ana Sayfa') {
                url = `https://www.googleapis.com/youtube/v3/videos?key=${API_KEY}&part=snippet&chart=mostPopular&regionCode=TR&maxResults=20`;
            } else if (currentMode === 'Trendler') {
                url = `https://www.googleapis.com/youtube/v3/videos?key=${API_KEY}&part=snippet&chart=mostPopular&regionCode=TR&maxResults=20&videoCategoryId=17`; 
            } else {
                url = `https://www.googleapis.com/youtube/v3/search?key=${API_KEY}&q=${encodeURIComponent(currentQuery)}&part=snippet&type=video&maxResults=20`;
            }

            if (nextPageToken) url += `&pageToken=${nextPageToken}`;

            try {
                const response = await fetch(url);
                const data = await response.json();

                if(data.items && data.items.length > 0) {
                    nextPageToken = data.nextPageToken || '';
                    const grid = document.getElementById('videoGrid');
                    
                    if(grid.children.length === 0) {
                        const firstId = (currentMode === 'Ana Sayfa' || currentMode === 'Trendler') ? data.items[0].id : data.items[0].id.videoId;
                        loadVideoDetails(firstId);
                    }

                    data.items.forEach(item => {
                        const vId = (currentMode === 'Ana Sayfa' || currentMode === 'Trendler') ? item.id : item.id.videoId;
                        if(!vId) return; 
                        
                        const title = item.snippet.title;
                        const thumb = item.snippet.thumbnails.high ? item.snippet.thumbnails.high.url : item.snippet.thumbnails.medium.url;

                        const card = document.createElement('div');
                        card.className = 'video-card';
                        card.onclick = () => loadVideoDetails(vId);
                        card.innerHTML = `
                            <div class="thumbnail-box"><img src="${thumb}"></div>
                            <div class="card-info">
                                <p class="card-title">${title}</p>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                    loadBtn.innerText = 'Daha Fazla Yukle';
                }
            } catch (error) {
                console.error(error);
            }
        }

        function loadVideoDetails(videoId) {
            activeVideoId = videoId;
            
            // Standart oynatıcıyı dolduruyoruz
            document.getElementById('mainPlayer').src = `https://www.youtube.com/embed/${videoId}?autoplay=1&rel=0`;
            
            // Meta dataları çekme
            const detailsUrl = `https://www.googleapis.com/youtube/v3/videos?key=${API_KEY}&id=${videoId}&part=snippet,statistics`;
            fetch(detailsUrl).then(res => res.json()).then(data => {
                if(data.items && data.items.length > 0) {
                    const videoData = data.items[0];
                    document.getElementById('mainTitle').innerText = videoData.snippet.title;
                    document.getElementById('mainViews').innerText = `${parseInt(videoData.statistics.viewCount || 0).toLocaleString('tr-TR')} Izlenme`;
                    document.getElementById('mainLikes').innerText = `${parseInt(videoData.statistics.likeCount || 0).toLocaleString('tr-TR')} Begeni`;
                    document.getElementById('mainDesc').innerText = videoData.snippet.description || 'Aciklama yok.';
                }
            });
        }

        // AKILLI TETİKLEYİCİ MODAL AÇICI
        function triggerBypass() {
            if(!activeVideoId) return;
            const modal = document.getElementById('bypassLayer');
            const iframe = document.getElementById('bypassPlayer');
            
            // YouTube'un ana site gibi davranmasını sağlayan özel parametreli embed yapısı
            iframe.src = `https://www.youtube.com/embed/${activeVideoId}?autoplay=1&modestbranding=1&rel=0&origin=${window.location.origin}`;
            modal.style.display = "flex";
        }

        function closeBypassVideo() {
            document.getElementById('bypassLayer').style.display = "none";
            document.getElementById('bypassPlayer').src = "";
        }

        function changeCategory(category, element) {
            document.querySelectorAll('.category-chip').forEach(btn => btn.classList.remove('active'));
            if(element) element.classList.add('active');
            document.getElementById('videoGrid').innerHTML = '';
            nextPageToken = '';
            currentMode = (category === 'Ana Sayfa' || category === 'Trendler') ? category : 'Search';
            currentQuery = category;
            fetchVideos();
        }

        function searchNewQuery() {
            const query = document.getElementById('searchInput').value;
            if(query.trim() !== "") {
                currentMode = 'Search'; currentQuery = query;
                nextPageToken = ''; document.getElementById('videoGrid').innerHTML = '';
                fetchVideos();
            }
        }

        function searchFromSidebar(channelName) {
            currentMode = 'Search'; currentQuery = channelName;
            nextPageToken = ''; document.getElementById('videoGrid').innerHTML = '';
            fetchVideos();
        }

        fetchVideos();
    </script>
</body>
</html>
