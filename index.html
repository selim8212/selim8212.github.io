<!DOCTYPE html>
<html lang="tr" class="dark" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelTube Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yt: {
                            black: '#0f0f0f',
                            sidebar: '#0f0f0f',
                            card: '#181818',
                            hover: '#272727',
                            border: '#2a2a2a',
                            red: '#ff0000'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #0f0f0f; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555555; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.95); }
        }
        .animate-pulse-glow { animation: pulse-glow 1.5s infinite ease-in-out; }
    </style>
</head>
<body class="bg-yt-black text-white min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white transition-colors duration-300 relative" id="body-theme">

    <!-- SAYFA YÜKLENME EKRANI -->
    <div id="page-loader" class="fixed inset-0 bg-yt-black/95 backdrop-blur-md z-[100] flex flex-col items-center justify-center transition-opacity duration-500">
        <div class="relative flex items-center justify-center mb-4">
            <div class="w-16 h-16 border-4 border-red-600/20 border-t-red-600 rounded-full animate-spin"></div>
            <div class="absolute bg-red-600 text-white p-2.5 rounded-xl shadow-lg shadow-red-600/50 animate-pulse-glow">
                <i class="fa-solid fa-play text-sm"></i>
            </div>
        </div>
        <span class="text-lg font-bold tracking-wide text-gray-200">SelTube <span class="text-xs text-red-500 font-extrabold">PREMIUM</span></span>
        <p class="text-xs text-gray-500 mt-2">Canlı YouTube İçerikleri Yükleniyor...</p>
    </div>

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 h-14 bg-yt-black/90 backdrop-blur-md border-b border-yt-border px-4 flex items-center justify-between z-50">
