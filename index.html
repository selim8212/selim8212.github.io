<!DOCTYPE html>
<html lang="tr" class="dark" id="html-root">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelTube Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        yt: {
                            black: '#0f0f0f',
                            sidebar: '#0f0f0f',
                            card: '#1f1f1f',
                            hover: '#383838',
                            border: '#272727',
                            red: '#cc0000'
                        }
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: inherit; }
        ::-webkit-scrollbar-thumb { background: #3f3f3f; border-radius: 4px; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-yt-black text-white min-h-screen flex flex-col justify-between selection:bg-red-600 selection:text-white transition-colors duration-300" id="body-theme">

    <!-- HEADER -->
    <header class="fixed top-0 left-0 right-0 h-14 bg-inherit/95 backdrop-blur-md border-b border-yt-border px-4 flex items-center justify-between z-50">
        <div class="flex items-center space-x-4">
            <button id="menu-toggle" class="p-2 hover:bg-yt-hover rounded-full transition text-gray-300">
                <i class="fa-solid fa-bars text-lg"></i>
            </button>
            <a href="#" onclick="location.reload();" class="flex items-center space-x-1.5 cursor-pointer group">
                <div class="bg-red-600 text-white p-2 rounded-xl flex items-center justify-center shadow-lg shadow-red-600/40">
                    <i class="fa-solid fa-play text-xs"></i>
                </div>
                <span class="text-xl font-bold tracking-tight">SelTube <span class="text-[10px] bg-red-600/20 text-red-500 border border-red-500/30 px-1.5 py-0.5 rounded font-bold ml-0.5">PREMIUM</span></span>
            </a>
        </div>

        <div class="flex items-center flex-1 max-w-2xl mx-4">
            <div class="flex items-center w-full bg-[#121212] border border-yt-border rounded-l-full px-4 py-2 focus-within:border-blue-500 transition">
                <i class="fa-solid fa-magnifying-glass text-gray-400 mr-3 text-sm"></i>
                <input type="text" id="search-input" data-i18n-placeholder="search_placeholder" placeholder="YouTube'da ara..." class="bg-transparent w-full focus:outline-none text-sm text-white placeholder-gray-500">
            </div>
            <button id="search-btn" class="bg-yt-card border border-l-0 border-yt-border px-6 py-2 rounded-r-full hover:bg-yt-hover transition text-gray-300">
                <i class="fa-solid fa-magnifying-glass text-sm"></i>
            </button>
        </div>

        <div class="flex items-center space-x-3">
            <a href="https://selim8212.github.io/license.pdf" target="_blank" class="hidden md:flex items-center space-x-1.5 bg-yt-card hover:bg-yt-hover border border-yt-border hover:border-red-600 text-gray-300 hover:text-white text-xs font-semibold px-3 py-1.5 rounded-full transition">
                <i class="fa-solid fa-file-contract text-red-500"></i>
                <span data-i18n="license_btn">Lisans</span>
            </a>
            <a href="SelTube-1.0.apk" download class="hidden sm:flex items-center space-x-2 bg-gradient-to-r from-red-600 to-rose-600 hover:from-red-500 text-white text-xs font-bold px-3.5 py-2 rounded-full transition shadow-md">
                <i class="fa-solid fa-download"></i>
                <span data-i18n="download_apk">APK İndir</span>
            </a>
            <button onclick="openSettingsModal()" class="p-2 hover:bg-yt-hover rounded-full transition text-gray-300" title="Ayarlar">
                <i class="fa-solid fa-gear text-lg"></i>
            </button>
            <div id="auth-container">
                <button onclick="openAuthModal()" class="border border-yt-border hover:border-gray-500 text-blue-400 font-semibold px-4 py-1.5 rounded-full text-sm transition flex items-center space-x-2">
                    <i class="fa-regular fa-circle-user text-base"></i>
                    <span data-i18n="login">Oturum Aç</span>
                </button>
            </div>
        </div>
    </header>

    <!-- CONTAINER -->
    <div class="flex pt-14 flex-1">
        <!-- SIDEBAR -->
        <aside id="sidebar" class="w-64 bg-yt-sidebar h-[calc(100vh-3.5rem)] fixed left-0 top-14 p-3 overflow-y-auto border-r border-yt-border z-40 transition-transform duration-300">
            <div class="space-y-1">
                <button onclick="searchVideos('Trending')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl bg-yt-hover text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-house w-5 text-center"></i>
                    <span data-i18n="home">Ana Sayfa</span>
                </button>
                <button onclick="searchVideos('Trendler Popüler')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-yt-hover text-gray-300 hover:text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-fire w-5 text-center text-orange-500"></i>
                    <span data-i18n="trending">Trendler</span>
                </button>
                <button onclick="searchVideos('Music 2026')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-yt-hover text-gray-300 hover:text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-music w-5 text-center text-blue-400"></i>
                    <span data-i18n="music">Müzik</span>
                </button>
                <button onclick="searchVideos('Gaming Gameplay')" class="w-full flex items-center space-x-6 px-3 py-2.5 rounded-xl hover:bg-yt-hover text-gray-300 hover:text-white font-medium text-sm transition text-left">
                    <i class="fa-solid fa-gamepad w-5 text-center text-green-400"></i>
                    <span data-i18n="gaming">Oyun
