<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SelTube Mobile - Cihaz Seçimi</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        h1 {
            color: #ff0000;
            margin-bottom: 30px;
            text-align: center;
        }
        .container {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .btn {
            background-color: #cc0000;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
            transition: background-color 0.2s, transform 0.2s;
            box-shadow: 0 4px 15px rgba(204, 0, 0, 0.4);
        }
        .btn:hover {
            background-color: #e60000;
            transform: scale(1.05);
        }
        .icon {
            width: 24px;
            height: 24px;
            fill: white;
        }
    </style>
</head>
<body>

    <h1>SelTube Mobil Sürümüne Hoş Geldiniz</h1>
    <p style="margin-bottom: 40px; color: #aaa;">Lütfen cihazınızı seçin:</p>
