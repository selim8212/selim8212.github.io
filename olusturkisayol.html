<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selim's Rastgele Link Oluşturucu</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 20px;
            color: #00bcd4;
        }
        input[type="text"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border: 1px solid #333;
            border-radius: 6px;
            background-color: #2b2b2b;
            color: #fff;
            box-sizing: border-box;
            font-size: 14px;
            text-align: center; /* Kodu ortalar */
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #00bcd4;
            border: none;
            border-radius: 6px;
            color: #121212;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            transition: 0.2s;
        }
        button:hover {
            background-color: #008c9e;
        }
        .result-box {
            margin-top: 20px;
            padding: 15px;
            background-color: #2b2b2b;
            border-radius: 6px;
            word-break: break-all;
            display: none; /* İlk başta gizli */
        }
        .result-box a {
            color: #00bcd4;
            text-decoration: none;
            font-weight: bold;
        }
        .result-box a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Rastgele Link Oluşturucu</h2>
    
    <!-- Program kodu buraya yazacak -->
    <input type="text" id="linkInput" placeholder="Kod otomatik oluşturulacak" readonly>
    <button onclick="linkOlustur()">Yeni Rastgele Link Oluştur</button>

    <div class="result-box" id="resultBox">
        <p style="margin-top:0; color:#aaa; font-size:13px;">Oluşturulan Bağlantı:</p>
        <a id="generatedLink" href="#" target="_blank"></a>
    </div>
</div>

<script>
    // Belirtilen uzunlukta rastgele kod üreten fonksiyon
    function rastgeleKodUret(uzunluk) {
        var karakterler = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        var sonuc = '';
        for ( var i = 0; i < uzunluk; i++ ) {
            sonuc += karakterler.charAt(Math.floor(Math.random() * karakterler.length));
        }
        return sonuc;
    }

    function linkOlustur() {
        var resultBox = document.getElementById("resultBox");
        var generatedLink = document.getElementById("generatedLink");
        var linkInput = document.getElementById("linkInput");

        // 1. Rastgele 6 karakterli bir kod üret (Örn: I8kAlO)
        var rastgeleId = rastgeleKodUret(6);
        
        // 2. Kodu giriş kutusuna yaz (readonly olduğu için kullanıcı değiştiremez)
        linkInput.value = rastgeleId;

        // 3. Temel adres ve final adresi oluştur
        var baseUrl = "https://selim8212.github.io/randomsayılar";
        var finalUrl = baseUrl + "?id=" + rastgeleId;

        // 4. Sonucu ekranda göster
        generatedLink.href = finalUrl;
        generatedLink.innerText = finalUrl;
        resultBox.style.display = "block";
    }
</script>

</body>
</html>
