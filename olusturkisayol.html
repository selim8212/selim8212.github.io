<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selim's Link Kısaltıcı</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            background-color: #161b22;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.6);
            width: 100%;
            max-width: 480px;
            border: 1px solid #30363d;
        }
        h2 { margin-bottom: 6px; color: #58a6ff; font-size: 22px; text-align: center; }
        p.subtitle { text-align: center; color: #8b949e; font-size: 13px; margin-bottom: 20px; }
        input[type="text"] {
            width: 100%; padding: 12px; border: 1px solid #30363d; border-radius: 8px;
            background-color: #0d1117; color: #fff; font-size: 14px; outline: none; margin-bottom: 15px;
        }
        input[type="text"]:focus { border-color: #58a6ff; }
        button {
            width: 100%; padding: 12px; background-color: #238636; border: none; border-radius: 8px;
            color: #ffffff; font-weight: bold; font-size: 15px; cursor: pointer; transition: 0.2s;
        }
        button:hover { background-color: #2ea043; }
        .result-box {
            margin-top: 20px; padding: 15px; background-color: #0d1117; border-radius: 8px;
            border: 1px solid #30363d; display: none; text-align: left;
        }
        .link-output {
            color: #58a6ff; font-weight: bold; font-size: 13px; word-break: break-all;
            display: block; margin-bottom: 10px; text-decoration: none;
        }
        .copy-btn { background-color: #30363d; color: #c9d1d9; padding: 8px; font-size: 13px; margin-top: 5px; }
        .copy-btn:hover { background-color: #484f58; }
    </style>
</head>
<body>

<div class="container">
    <h2>Link Kısaltıcı</h2>
    <p class="subtitle">selim8212.github.io</p>
    
    <input type="text" id="targetUrl" placeholder="Kısaltılacak linki yaz (örn: youtube.com)">
    <button onclick="kisayolOlustur()">Oluştur</button>

    <div class="result-box" id="resultBox">
        <p style="font-size:12px; color:#8b949e; margin-bottom:6px;">Oluşturulan Kısa Link:</p>
        <a id="generatedLinkText" class="link-output" href="#" target="_blank"></a>
        <button class="copy-btn" onclick="linkKopyala()">Linki Kopyala</button>
    </div>
</div>

<script>
    function kisayolOlustur() {
        var inputVal = document.getElementById("targetUrl").value.trim();
        var resultBox = document.getElementById("resultBox");
        var generatedLinkText = document.getElementById("generatedLinkText");

        if (inputVal === "") {
            alert("Lütfen bir link yaz!");
            return;
        }

        if (!inputVal.startsWith("http://") && !inputVal.startsWith("https://")) {
            inputVal = "https://" + inputVal;
        }

        // Linki şifreleyerek randomsayılar klasörüne yönlendiriyoruz
        var encodedUrl = btoa(encodeURIComponent(inputVal));
        var finalUrl = "https://selim8212.github.io/randomsayılar/?to=" + encodedUrl;

        generatedLinkText.href = finalUrl;
        generatedLinkText.innerText = finalUrl;
        resultBox.style.display = "block";
    }

    function linkKopyala() {
        var linkText = document.getElementById("generatedLinkText").innerText;
        navigator.clipboard.writeText(linkText).then(function() {
            alert("Link kopyalandı!");
        });
    }
</script>

</body>
</html>
